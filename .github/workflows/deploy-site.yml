# Publishes the setup page to GitHub Pages when a release is published,
# with that release's firmware: no server, no FTP logins.
#
# The firmware image comes from the GitHub release and is checked against
# the SHA-256 and size in web/firmware/manifest.json before anything is
# published. The page's own files come from the release's tag, or, for a
# run by hand without a tag, from the branch it was started on: page
# changes go online without a new release. Then manifest.json there must
# name the latest release, so a branch with firmware that isn't released
# yet stops here.
#
# Updates for the Sticky itself come from GitHub Releases too: it reads
# releases/latest/download/ota-manifest.json, and the OTA image is an
# asset of the release.
#
# Pages needs "GitHub Actions" as its source (Settings › Pages). The
# address is https://<owner>.github.io/sticky-remote/.
#
# Run it by hand from the Actions tab (Run workflow): with a tag, redeploys
# that release as it was; empty, publishes the branch's page.
name: Deploy the setup page

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to redeploy as it was (empty: this branch's page, with the latest release)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Which release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          echo "Deploying $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'release' || inputs.tag != '') && steps.rel.outputs.tag || github.sha }}

      - name: Firmware from the release, checked against manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          M=web/firmware/manifest.json
          VERSION=$(jq -r .version "$M"); FILE=$(jq -r .file "$M")
          [ "v$VERSION" = "$TAG" ] || { echo "::error::manifest.json says $VERSION, the release is $TAG"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$FILE" --dir web/firmware
          echo "$(jq -r .sha256 "$M")  web/firmware/$FILE" | sha256sum -c -
          [ "$(stat -c%s "web/firmware/$FILE")" = "$(jq -r .size "$M")" ] || { echo "::error::size differs from manifest.json"; exit 1; }

      - name: Stage the page
        # Tags before 0.7.2 copy with macOS's ditto; cp -R does the same here.
        run: |
          sed -i 's/^ditto /cp -R /' web/stage.sh
          web/stage.sh

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/upload/sticky

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
